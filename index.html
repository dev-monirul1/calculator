<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- ===== css link start ==== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <!-- ===== css link end ==== -->
</head>

<body>
    <div class="container">
        <div class="calculator">
            <div class="display">
                <input type="text" class="input">
            </div>

            <div class="ButtonWrap">
                <div class="ButtonFlex">
                    <button class="btn1 clear">AC</button>
                    <button class="btn1 operator" id="delete">DEL</button>
                    <button class="btn1 operator">%</button>
                    <button class="btn1 operator">÷</button>
                </div>
                <div class="ButtonFlex">
                    <button class="btn1">7</button>
                    <button class="btn1">8</button>
                    <button class="btn1">9</button>
                    <button class="btn1 operator">×</button>
                </div>
                <div class="ButtonFlex">
                    <button class="btn1">4</button>
                    <button class="btn1">5</button>
                    <button class="btn1">6</button>
                    <button class="btn1 operator">−</button>
                </div>
                <div class="ButtonFlex">
                    <button class="btn1">1</button>
                    <button class="btn1">2</button>
                    <button class="btn1">3</button>
                    <button class="btn1 operator">+</button>
                </div>
                <div class="ButtonFlex">
                    <button class="btn1">00</button>
                    <button class="btn1">0</button>
                    <button class="btn1">.</button>
                    <button class="btn1 equal">=</button>
                </div>
            </div>
        </div>
    </div>









    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>

</html>
