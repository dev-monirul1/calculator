<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- ===== css link start ==== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <!-- ===== css link end ==== -->
</head>

<body>
    <div class="container">
        <div class="calculator">

            <!-- calculator display start -->
            <div class="display">
                <input type="text" id="display" >
            </div>
            <!-- calculator display end -->

            <!-- calculator buttons start -->
            <div class="buttons">

                <!-- first row start -->
                <button class="btn clear" id="clear">AC</button>
                <button class="btn operator" id="delete">DEL</button>
                <button class="btn operator">%</button>
                <button class="btn operator">÷</button>
                <!-- first row end -->

                <!-- second row start -->
                <button class="btn">7</button>
                <button class="btn">8</button>
                <button class="btn">9</button>
                <button class="btn operator">×</button>
                <!-- second row end -->

                <!-- third row start -->
                <button class="btn">4</button>
                <button class="btn">5</button>
                <button class="btn">6</button>
                <button class="btn operator">−</button>
                <!-- third row end -->

                <!-- fourth row start -->
                <button class="btn">1</button>
                <button class="btn">2</button>
                <button class="btn">3</button>
                <button class="btn operator">+</button>
                <!-- fourth row end -->

                <!-- fifth row start -->
                <button class="btn">00</button>
                <button class="btn">0</button>
                <button class="btn">.</button>
                <button class="btn equal">=</button>
                <!-- fifth row end -->

            </div>
            <!-- Calculator Buttons end -->

        </div>
    </div>









    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>

</html>
